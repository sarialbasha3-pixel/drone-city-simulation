<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous Drone City Simulation - Large Scale Realistic Environment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0e14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00e5ff;
      font-family: 'Courier New', Courier, monospace;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="font-size: 18px; font-weight: bold; letter-spacing: 2px;">INITIALIZING DRONE CITY ENVIRONMENT</div>
    <div style="font-size: 12px; color: #78909c; margin-top: 8px;">Generating 1.5km City Districts, Bridge, Roads & PBR Shaders...</div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 600);
        }
      }, 800);
    });
  </script>
</body>
</html>
